{% if site.owner.avatar %}
<img src="{{ '/assets/images/' | append: site.owner.avatar | relative_url }}" class="bio-photo" alt="{{ site.owner.name }}">
{% endif %}

<h3>{{ site.owner.name }}</h3>

<p class="bio-desc">{{ site.owner.bio }}</p>

<div class="author-sidebar-links">
  {% if site.owner.linkedin %}
  <p class="author-link">
    <a href="https://linkedin.com/in/{{ site.owner.linkedin }}" target="_blank"><i class="icon-linkedin"></i> LinkedIn</a>
  </p>
  {% endif %}
</div>
