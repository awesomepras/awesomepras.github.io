# --------------------------------------------------
#  BASIC SITE INFO
# --------------------------------------------------
title: Awesomepras
tagline: DevOps, Cloud Architecture & Tech Notes
description: Personal website and tech notes of Prasana Raman. Powered by Jekyll, based on the Minimal Mistakes theme.

# URL settings
url: "https://awesomepras.github.io"
baseurl: ""

# --------------------------------------------------
#  AUTHOR / PROFILE DATA (used in 2-column sidebar & footer)
# --------------------------------------------------
owner:
  name: Prasana Raman
  avatar: damn.jpg
  bio: Passionate about technology, cloud infrastructure, DevOps, and SRE.
  email: prasana@alienfrompondy.com
  github: awesomepras
  twitter: awesomepras
  linkedin: prasanaraman
  mastodon: https://mstdn.ca/deck/@awesomepras

# --------------------------------------------------
#  TOP NAVIGATION BAR
# --------------------------------------------------
links:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: SRE
    url: /sre/
  - title: CI/CD
    url: /cicd/
  - title: Monitoring
    url: /monitoring/
  - title: Security
    url: /security/
  - title: Cloud Run
    url: /cloudrun-functions/
  - title: Practice Qs
    url: /practice-questions/

# --------------------------------------------------
#  BUILD & RENDERING SETTINGS
# --------------------------------------------------
future: true
highlighter: rouge
markdown: kramdown
permalink: /:year/:month/:day/:title.html

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

# --------------------------------------------------
#  COLLECTIONS & DEFAULTS
# --------------------------------------------------
collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "awesomepras"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# --------------------------------------------------
#  PLUG-INS & PAGINATION
# --------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "page:num/"

include: [".htaccess"]
exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
  - ".jekyll-cache"
